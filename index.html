<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Block Wrap Printer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Turn a Minecraft skin or block texture into tiled, printable panels that wrap a cardboard cube or box.">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* Layout: workbench — controls in a narrow left column, live box, net and sheet plan on a cutting-mat area to the right. */
:root {
  --bg: #eef1ec;
  --surface: #ffffff;
  --ink: #1b231e;
  --muted: #59655d;
  --line: #d3dad2;
  --mat: #dfe6de;
  --mat-grid: #c9d3c8;
  --accent: #c8460f;
  --accent-ink: #ffffff;
  --warn-bg: #fff1e6;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121612; --surface: #1b211c; --ink: #e5ebe4; --muted: #9aa69c; --line: #2f3831;
    --mat: #18201a; --mat-grid: #243026; --accent: #ff7b3f; --accent-ink: #1a0d05; --warn-bg: #2d1c12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121612; --surface: #1b211c; --ink: #e5ebe4; --muted: #9aa69c; --line: #2f3831;
  --mat: #18201a; --mat-grid: #243026; --accent: #ff7b3f; --accent-ink: #1a0d05; --warn-bg: #2d1c12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 36px); line-height: 1.1; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); max-width: 62ch; }
.bench { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
legend { font-family: var(--font-display); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0; margin-bottom: 8px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row > *, .row3 > * { min-width: 0; }
.group { display: flex; flex-direction: column; gap: 10px; }
input[type="number"], input[type="text"], select {
  font: inherit; font-family: var(--font-data); font-size: 14px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 7px 8px; width: 100%;
}
input:focus-visible, select:focus-visible, button:focus-visible, .drop:focus-within, .seg label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg label { text-align: center; font-size: 13px; font-weight: 600; padding: 7px; cursor: pointer; background: var(--bg); }
.seg label + label { border-left: 1px solid var(--line); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
.presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.preset { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 4px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.preset canvas { width: 40px; height: 40px; image-rendering: pixelated; }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.drop { border: 1px dashed var(--muted); border-radius: 4px; padding: 12px; font-size: 13px; color: var(--muted); text-align: center; cursor: pointer; position: relative; }
.drop.over { border-color: var(--accent); color: var(--ink); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.drop strong { color: var(--ink); }
.notice { background: var(--warn-bg); border-left: 3px solid var(--accent); padding: 8px 10px; font-size: 13px; border-radius: 0 4px 4px 0; }
.mat {
  background-color: var(--mat);
  background-image: linear-gradient(var(--mat-grid) 1px, transparent 1px), linear-gradient(90deg, var(--mat-grid) 1px, transparent 1px);
  background-size: 24px 24px; border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 18px; min-width: 0;
}
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-family: var(--font-data); font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat span { font-size: 12px; color: var(--muted); }
.views { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 700px) { .views { grid-template-columns: minmax(0, 1fr); } }
figure { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
figcaption { font-size: 12px; color: var(--muted); }
figcaption b { color: var(--ink); font-weight: 600; }
.preview-caption { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.scale-ref { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.scale-ref select { font: inherit; font-size: 12px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.scale-ref select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; display: grid; place-items: center; padding: 12px; min-height: 280px; position: relative; }
.stage canvas { max-width: 100%; height: auto; image-rendering: pixelated; }
.box-stage { perspective: 900px; touch-action: none; cursor: grab; overflow: hidden; }
.box3d { width: 0; height: 0; position: relative; transform-style: preserve-3d; }
.box3d canvas { position: absolute; left: 0; top: 0; max-width: none; image-rendering: pixelated; backface-visibility: hidden; }
.plan-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.plan-head select { width: auto; }
.make { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.btn { font: inherit; font-weight: 600; font-size: 15px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 11px 18px; cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: default; }
#status { font-size: 13px; color: var(--muted); font-family: var(--font-data); min-width: 0; overflow-wrap: anywhere; }
.facts { font-size: 13px; color: var(--muted); margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.facts b { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Block Wrap Printer</h1>
    <p>Turn a Minecraft texture into printable panels that wrap a cardboard cube or box. Pick a texture, give the size, and it plans the sheets, overlaps and fold tabs for you.</p>
  </header>

  <div class="bench">
    <form class="panel" id="controls" autocomplete="off">
      <fieldset>
        <legend>Texture</legend>
        <div class="presets" id="presets"></div>
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/png,image/gif,image/webp,image/jpeg">
          <strong>Upload your own texture</strong><br>skin, unfolded cube, or a single tile
        </label>
        <div class="notice" id="notice" hidden></div>
        <label class="field">Read the image as
          <select id="layout">
            <option value="skin">Creature skin (head only)</option>
            <option value="net">Unfolded cube (cross shape)</option>
            <option value="tile">One tile on every side</option>
          </select>
        </label>
        <label class="check" id="hatRow"><input type="checkbox" id="hat" checked> Include the skin's hat layer</label>
        <label class="field" id="uniformRow">Sides
          <select id="uniform">
            <option value="">Each side as drawn</option>
            <option value="bottom">Bottom face on every side</option>
            <option value="top">Top face on every side</option>
            <option value="front">Front face on every side</option>
          </select>
        </label>
        <label class="field">Name on the guide page
          <input type="text" id="title" maxlength="40">
        </label>
      </fieldset>

      <fieldset>
        <legend>Shape</legend>
        <div class="seg" role="radiogroup" aria-label="Shape">
          <label><input type="radio" name="shape" id="shapeCube" value="cube" checked> Cube</label>
          <label><input type="radio" name="shape" id="shapeBox" value="box"> Box</label>
        </div>
        <div class="row" id="cubeFields">
          <label class="field">Face size
            <input type="number" id="size" min="0" step="any" inputmode="decimal">
          </label>
          <label class="field">Unit
            <select id="unit"><option value="mm">mm</option><option value="cm">cm</option><option value="in">inches</option></select>
          </label>
        </div>
        <div class="group" id="boxFields" hidden>
          <div class="row3">
            <label class="field">Length <input type="number" id="dimA" min="0" step="any" inputmode="decimal"></label>
            <label class="field">Width <input type="number" id="dimB" min="0" step="any" inputmode="decimal"></label>
            <label class="field">Height <input type="number" id="dimC" min="0" step="any" inputmode="decimal"></label>
          </div>
          <span class="hint" id="boxUnitHint"></span>
          <label class="field">Top of the box
            <select id="topFace"></select>
          </label>
          <label class="field">Front of the box
            <select id="frontEdge"></select>
          </label>
          <label class="field">Pattern on uneven faces
            <select id="fit">
              <option value="stretch">Stretch to fit</option>
              <option value="tile">Repeat</option>
              <option value="mirror">Repeat, mirrored</option>
            </select>
            <span class="hint" id="fitHint"></span>
          </label>
        </div>
        <label class="field">Wrap tab width (mm)
          <input type="number" id="wrap" min="0" step="any" inputmode="decimal">
          <span class="hint">Texture-printed flaps that fold around each edge.</span>
        </label>
        <label class="check"><input type="checkbox" id="bottom" checked> Print the bottom face</label>
      </fieldset>

      <fieldset>
        <legend>Paper</legend>
        <label class="field">Paper size
          <select id="paper">
            <option value="a3">A3 (297 × 420 mm)</option>
            <option value="a4">A4 (210 × 297 mm)</option>
            <option value="letter">US Letter (8.5 × 11 in)</option>
            <option value="tabloid">Tabloid (11 × 17 in)</option>
          </select>
        </label>
        <div class="row">
          <label class="field">Overlap (mm)
            <input type="number" id="overlap" min="5" step="any" placeholder="auto" inputmode="decimal">
          </label>
          <label class="field">Printer margin (mm)
            <input type="number" id="margin" min="0" max="25" step="any" inputmode="decimal">
          </label>
        </div>
        <span class="hint">Leave overlap blank to let the planner pick the widest one that fits.</span>
      </fieldset>
    </form>

    <section class="mat" aria-label="Preview and sheet plan">
      <div class="stats" id="stats"></div>
      <div class="views">
        <figure>
          <div class="stage box-stage" id="boxStage"><div class="box3d" id="box3d"></div></div>
          <figcaption class="preview-caption">
            <span><b>Preview.</b> Drag to turn it.</span>
            <label class="scale-ref">
              <span>Scale:</span>
              <select id="scaleRef" title="Choose a scale comparison object">
                <option value="can">🥤 Soda can (122 mm)</option>
                <option value="banana">🍌 Banana (180 mm)</option>
                <option value="none">None</option>
              </select>
            </label>
          </figcaption>
        </figure>
        <figure>
          <div class="stage"><canvas id="net" width="300" height="400"></canvas></div>
          <figcaption><b>The six faces</b>, unfolded to scale. Left and right are as seen from the front.</figcaption>
        </figure>
      </div>
      <figure>
        <div class="plan-head">
          <figcaption id="planCaption"></figcaption>
          <label class="check">Face <select id="planFace"></select></label>
        </div>
        <div class="stage"><canvas id="plan" width="560" height="560"></canvas></div>
      </figure>
      <div class="make">
        <button class="btn" type="button" id="makeBtn">Make the PDF</button>
        <span id="status"></span>
      </div>
      <ul class="facts" id="facts"></ul>
    </section>
  </div>
</div>

function gcd(a, b) { while (b) [a, b] = [b, a % b]; return a; }

function hasTransparency(img, x, y, w, h) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      if (img.data[(j * img.width + i) * 4 + 3] < 128) return true;
  return false;
}

/** Guess how an image is laid out; null when it cannot tell. */
function detectLayout(img) {
  const { width: w, height: h } = img;
  if (w === 2 * h && w % 64 === 0) return "skin";
  if (w === h && w % 64 === 0 && hasTransparency(img, 0, 0, w / 8, h / 8)) return "skin";
  if (w * 4 === h * 3 && w % 3 === 0) return "net";
  if (w === h) return "tile";
  return null;
}

/** Read a square region and reduce it to its real texel grid (upscaled art collapses back). */
function readSquare(img, x, y, s) {
  const d = img.data, W = img.width;
  const at = (i, j) => ((y + j) * W + (x + i)) * 4;
  const same = (a, b) => d[a] === d[b] && d[a + 1] === d[b + 1] && d[a + 2] === d[b + 2] && d[a + 3] === d[b + 3];
  let g = s;
  for (let j = 0; j < s && g > 1; j++) {
    let run = 1;
    for (let i = 1; i < s; i++) { if (same(at(i, j), at(i - 1, j))) run++; else { g = gcd(g, run); run = 1; } }
    g = gcd(g, run);
  }
  for (let i = 0; i < s && g > 1; i++) {
    let run = 1;
    for (let j = 1; j < s; j++) { if (same(at(i, j), at(i, j - 1))) run++; else { g = gcd(g, run); run = 1; } }
    g = gcd(g, run);
  }
  const n = Math.min(64, s / g);
  const px = new Uint8ClampedArray(n * n * 4);
  for (let j = 0; j < n; j++)
    for (let i = 0; i < n; i++) {
      const src = at(Math.floor((i + 0.5) * s / n), Math.floor((j + 0.5) * s / n));
      px.set(d.subarray(src, src + 4), (j * n + i) * 4);
    }
  return { n, px };
}

/** Rotate a face clockwise by 90° × turns. */
function rotateFace(f, turns) {
  let out = f;
  for (let t = 0; t < ((turns % 4) + 4) % 4; t++) {
    const n = out.n, px = new Uint8ClampedArray(out.px.length);
    for (let y = 0; y < n; y++)
      for (let x = 0; x < n; x++) {
        const src = ((n - 1 - x) * n + y) * 4;
        px.set(out.px.subarray(src, src + 4), (y * n + x) * 4);
      }
    out = { n, px };
  }
  return out;
}

function overlayFace(base, top) {
  if (base.n !== top.n) return base;
  const px = base.px.slice();
  for (let i = 0; i < px.length; i += 4)
    if (top.px[i + 3] >= 128) px.set(top.px.subarray(i, i + 4), i);
  return { n: base.n, px };
}

function flattenFace(f) { // transparent texels print as bare paper
  const px = f.px.slice();
  for (let i = 0; i < px.length; i += 4) if (px[i + 3] < 128) px.set([255, 255, 255, 0], i);
  return { n: f.n, px };
}

/**
 * Pull six faces out of an image. Left and right are as seen when facing the front.
 * Returns { faces } or { error }.
 */
function extractFaces(img, layout, opts = {}) {
  const { width: w, height: h } = img;
  const faces = {};
  if (layout === "skin") {
    if (!(w % 64 === 0 && (w === 2 * h || w === h)))
      return { error: `A skin should be 64 × 32 or 64 × 64 pixels (or a multiple). This image is ${w} × ${h}.` };
    const k = w / 64;
    // Minecraft head UVs. The character's own right side is on your left when you face it.
    const uv = { top: [8, 0], bottom: [16, 0], left: [0, 8], front: [8, 8], right: [16, 8], back: [24, 8] };
    for (const [name, [u, v]] of Object.entries(uv)) {
      let face = readSquare(img, u * k, v * k, 8 * k);
      if (opts.hat !== false) face = overlayFace(face, readSquare(img, (u + 32) * k, v * k, 8 * k));
      faces[name] = face;
    }
  } else if (layout === "net") {
    if (w * 4 !== h * 3 || w % 3 !== 0)
      return { error: `An unfolded cube should be 3 faces wide and 4 tall (3:4). This image is ${w} × ${h}.` };
    const f = w / 3;
    // Cross layout: back above the top, left/top/right across, then front and bottom below.
    const cells = { back: [1, 0, 2], left: [0, 1, 3], top: [1, 1, 0], right: [2, 1, 1], front: [1, 2, 0], bottom: [1, 3, 0] };
    for (const [name, [cx, cy, turns]] of Object.entries(cells))
      faces[name] = rotateFace(readSquare(img, cx * f, cy * f, f), turns);
  } else if (layout === "tile") {
    const s = Math.min(w, h);
    const tile = readSquare(img, Math.floor((w - s) / 2), Math.floor((h - s) / 2), s);
    for (const name of FACE_ORDER) faces[name] = tile;
  } else {
    return { error: "Choose how to read this image." };
  }
  if (opts.uniform && faces[opts.uniform]) for (const name of FACE_ORDER) faces[name] = faces[opts.uniform];
  for (const name of FACE_ORDER) faces[name] = flattenFace(faces[name]);
  return { faces };
}

/** Each face's printed width × height for a box W wide, D deep and H tall. Sides print upright. */
function faceSizes({ W, D, H }) {
  return { front: [W, H], back: [W, H], left: [D, H], right: [D, H], top: [W, D], bottom: [W, D] };
}

/**
 * Split one axis of a face into bands of texels. Positions include the wrap tab,
 * so the face itself runs from `wrap` to `wrap + len`; tab bands repeat the edge texel.
 * fit: "stretch" squeezes n texels into len; "tile"/"mirror" use square pixels of `pixel` mm.
 */
function axisBands(len, n, fit, pixel, centred, wrap) {
  const bands = [];
  if (fit === "stretch") {
    const p = len / n;
    for (let j = 0; j < n; j++) bands.push({ a: wrap + j * p, b: wrap + (j + 1) * p, i: j });
  } else {
    const period = n * pixel;
    const s0 = centred ? (len - period) / 2 : 0;
    const m = Math.max(0, Math.ceil(s0 / period - 1e-9)); // copies before the anchored one
    const start = s0 - m * period;
    for (let k = 0; start + k * pixel < len - 1e-6; k++) {
      const a = start + k * pixel, b = a + pixel;
      if (b <= 1e-6) continue;
      const copy = Math.floor(k / n);
      let i = k % n;
      if (fit === "mirror" && Math.abs(copy - m) % 2 === 1) i = n - 1 - i;
      bands.push({ a: wrap + Math.max(0, a), b: wrap + Math.min(len, b), i });
    }
  }
  if (wrap > 0) {
    bands.unshift({ a: 0, b: wrap, i: bands[0].i, tab: true });
    bands.push({ a: wrap + len, b: 2 * wrap + len, i: bands[bands.length - 1].i, tab: true });
  }
  return bands;
}

/** Texel bands for one face of the box. Repeats are centred side to side; sides hang from their top edge. */
function faceBands(name, box, n, fit, wrap) {
  const [w, h] = faceSizes(box)[name];
  const pixel = Math.min(box.W, box.D, box.H) / n;
  const flat = name === "top" || name === "bottom";
  return { w, h, xb: axisBands(w, n, fit, pixel, true, wrap), yb: axisBands(h, n, fit, pixel, flat, wrap) };
}

/** Fewest sheets for a Tw × Th panel; sheets share one size and neighbours share an overlap band. */
function planPanel(Tw, Th, paper, margin, overlap) {
  const P = PAPERS[paper];
  const options = [];
  for (const [orient, pw, ph] of [["portrait", P.w, P.h], ["landscape", P.h, P.w]]) {
    const W = pw - 2 * margin - 2 * GUT;
    const H = ph - 2 * margin - HEAD - FOOT - 2 * GUT;
    if (W <= 0 || H <= 0) continue;
    const ov = overlap ?? MIN_AUTO_OVERLAP;
    for (let cols = 1; cols <= 30; cols++) {
      const tw = cols === 1 ? Tw : (Tw + (cols - 1) * ov) / cols;
      if (tw > W) continue;
      for (let rows = 1; rows <= 30; rows++) {
        const th = rows === 1 ? Th : (Th + (rows - 1) * ov) / rows;
        if (th > H) continue;
        if ((cols > 1 && ov >= tw) || (rows > 1 && ov >= th)) continue;
        options.push({ orient, pw, ph, W, H, cols, rows });
        break;
      }
    }
  }
  if (!options.length) return null;
  options.sort((a, b) => a.cols * a.rows - b.cols * b.rows || (a.orient === "portrait" ? -1 : 1) - (b.orient === "portrait" ? -1 : 1));
  const g = options[0];
  let ov = overlap;
  if (ov == null) {
    // Widest overlap up to the cap that still fits this grid.
    let limit = MAX_AUTO_OVERLAP;
    if (g.cols > 1) limit = Math.min(limit, (g.cols * g.W - Tw) / (g.cols - 1));
    if (g.rows > 1) limit = Math.min(limit, (g.rows * g.H - Th) / (g.rows - 1));
    ov = Math.max(MIN_AUTO_OVERLAP, Math.floor(limit));
  }
  const tw = g.cols === 1 ? Tw : (Tw + (g.cols - 1) * ov) / g.cols;
  const th = g.rows === 1 ? Th : (Th + (g.rows - 1) * ov) / g.rows;
  return { orient: g.orient, pageW: g.pw, pageH: g.ph, cols: g.cols, rows: g.rows, tw, th,
    overlap: g.cols * g.rows > 1 ? ov : 0, stepX: tw - ov, stepY: th - ov };
}

/** Plan every face of the box. box = { W, D, H } in mm; n = texels per face edge. */
function planLayout({ box, n, fit, wrap, paper, margin, overlap, includeBottom }) {
  const names = includeBottom ? FACE_ORDER : FACE_ORDER.filter(f => f !== "bottom");
  const faces = [];
  for (const name of names) {
    const bands = faceBands(name, box, n, fit, wrap);
    const Tw = bands.w + 2 * wrap, Th = bands.h + 2 * wrap;
    const grid = planPanel(Tw, Th, paper, margin, overlap);
    if (!grid) return { error: `The ${name} face does not fit on this paper. Try a smaller margin, a smaller overlap or a larger paper size.` };
    faces.push({ name, ...bands, Tw, Th, ...grid, sheets: grid.cols * grid.rows });
  }
  const cube = box.W === box.D && box.D === box.H;
  return { box, cube, n, fit, wrap, margin, paper, paperName: PAPERS[paper].name, faces,
    totalSheets: faces.reduce((s, f) => s + f.sheets, 0) };
}

function sheetId(col, row) {
  let label = "";
  for (let n = col + 1; n > 0; n = Math.floor((n - 1) / 26)) label = String.fromCharCode(65 + (n - 1) % 26) + label;
  return label + (row + 1);
}
const fmt = v => (Math.round(v * 10) / 10).toString();
const EDGE_NOTE = { top: "BACK EDGE", bottom: "FRONT EDGE" };
const boxText = b => `${fmt(b.W)} x ${fmt(b.D)} x ${fmt(b.H)} mm`;

/** Draw the texels of one face panel that fall inside a window of it. */
function drawFaceArt(doc, face, fp, win, toPage) {
  const n = face.n, bleed = 0.06;
  const color = (yb, xb) => (Math.min(n - 1, yb.i) * n + Math.min(n - 1, xb.i)) * 4;
  for (const yb of fp.yb) {
    if (yb.b <= win.y0 || yb.a >= win.y1) continue;
    let k = 0;
    while (k < fp.xb.length) {
      const xb = fp.xb[k], idx = color(yb, xb);
      if ((xb.tab && yb.tab) || face.px[idx + 3] < 128) { k++; continue; }
      let end = k;
      while (end + 1 < fp.xb.length) {
        const nx = fp.xb[end + 1], j = color(yb, nx);
        if ((nx.tab && yb.tab) || face.px[j + 3] < 128 || face.px[j] !== face.px[idx] || face.px[j + 1] !== face.px[idx + 1] || face.px[j + 2] !== face.px[idx + 2]) break;
        end++;
      }
      const xa = xb.a, xe = fp.xb[end].b;
      k = end + 1;
      if (xe <= win.x0 || xa >= win.x1) continue;
      const x1 = Math.max(xa - bleed, win.x0), x2 = Math.min(xe + bleed, win.x1);
      const y1 = Math.max(yb.a - bleed, win.y0), y2 = Math.min(yb.b + bleed, win.y1);
      doc.setFillColor(face.px[idx], face.px[idx + 1], face.px[idx + 2]);
      doc.rect(toPage.x(x1), toPage.y(y1), x2 - x1, y2 - y1, "F");
    }
  }
}

function setText(doc, size, bold) { doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor(32, 43, 51); }

function textUp(doc, str, x, yMid) { // reads bottom-to-top, centred on yMid
  doc.text(str, x, yMid + doc.getTextWidth(str) / 2, { angle: 90 });
}

// Fit a single line without allowing uploaded filenames to cover neighbouring content.
function fittedText(doc, text, x, y, width, size, bold = false, options = {}) {
  setText(doc, size, bold);
  let value = String(text);
  if (doc.getTextWidth(value) > width) {
    while (value.length && doc.getTextWidth(value + "...") > width) value = value.slice(0, -1);
    value += "...";
  }
  doc.text(value, x, y, options);
}

function scaleBar(doc, x, y, len) {
  doc.setDrawColor(32, 43, 51); doc.setLineWidth(0.5);
  doc.line(x, y, x + len, y);
  doc.line(x, y - 2, x, y + 2); doc.line(x + len, y - 2, x + len, y + 2);
  setText(doc, 7.5, false);
  doc.text(`This line must measure exactly ${len} mm`, x, y + 5);
}

function guidePage(doc, plan, meta, pageList) {
  const P = PAPERS[plan.paper], pw = P.w, ph = P.h, m = plan.margin;
  const L = m + 6, R = pw - m - 6;
  let y = m + 14, guidePages = 1;
  fittedText(doc, meta.title.toUpperCase(), L, y, R - L, 24, true);
  y += 8;
  fittedText(doc, `Cardboard ${plan.cube ? "cube" : "box"} wrap / ${plan.paperName} printing and assembly`, L, y, R - L, 12);
  const b = plan.box, overlaps = [...new Set(plan.faces.filter(f => f.overlap).map(f => fmt(f.overlap)))];
  const facts = [
    plan.cube ? `Finished face: ${fmt(b.W)} x ${fmt(b.W)} mm (${fmt(b.W / 25.4)} in)`
      : `Box: ${fmt(b.W)} wide x ${fmt(b.D)} deep x ${fmt(b.H)} tall (mm)`,
    plan.cube ? `Wrap tabs: ${fmt(plan.wrap)} mm on all four edges` : `Pattern ${FIT_NAMES[plan.fit]} / wrap tabs ${fmt(plan.wrap)} mm`,
    overlaps.length ? `Overlap between sheets: ${overlaps.join(" / ")} mm` : "Each face fits on one sheet",
    `Paper: ${plan.paperName}, ${plan.totalSheets} sheets + assembly guide`,
  ];
  let netW = 0, netH = 0;
  const factsTop = y + 10;
  if (meta.netPng) {
    netW = Math.min(64, (R - L) * 0.32); netH = netW * meta.netAspect;
    if (netH > 90) { netW *= 90 / netH; netH = 90; }
    doc.addImage(meta.netPng, "PNG", R - netW, factsTop - 4, netW, netH);
  }
  y += 10; setText(doc, 10.5, true);
  for (const f of facts) {
    const lines = doc.splitTextToSize(f, R - L - (netW ? netW + 6 : 0));
    doc.text(lines, L, y); y += lines.length * 5.5;
  }
  y = Math.max(y, factsTop - 4 + netH);
  const textW = R - L;
  const steps = [
    ["1  CHECK THE BOX", [
      plan.cube ? `This file assumes every face measures ${fmt(b.W)} x ${fmt(b.W)} mm. Measure the box before printing the full set.`
        : `This file assumes the box is ${boxText(b)} (width x depth x height). Measure it before printing the full set.`,
    ]],
    ["2  PRINT AT ACTUAL SIZE", [
      `Use ${plan.paperName} paper, single-sided. Each sheet's page is set portrait or landscape to suit it. Choose Actual size / 100% and turn off Fit or Shrink.`,
      "Print one sheet first and check that its scale line measures what it says.",
    ]],
    ["3  PAGES", pageList],
    ["4  TRIM AND JOIN EACH FACE", [
      "Each sheet is named by column letter and row number: A1 is top-left. Trim every sheet at its corner marks.",
      "Brackets outside the artwork mark the bands that neighbouring sheets share.",
      "Start with A1. Each later sheet slides under the earlier one: B1 goes under A1, A2 under A1, B2 under B1 and A2.",
      "Line up the shared texture and tape the back.",
    ]],
    ["5  FOLD AND ATTACH", [
      "Cut away the blank corner squares marked CUT. Keep the textured tabs.",
      "Fold at the dashed ticks so each face matches the box exactly.",
      "Side faces print with their top edge up. Left and right are as seen when facing the front.",
      "Fold the tabs onto neighbouring faces and cover them with the next panel. Add the top last.",
      "Trim any tab that would cover a face you have already finished.",
    ]],
  ];
  // Keep the calibration footer clear and flow instructions onto further guide pages.
  const bottom = ph - m - 24;
  const nextPage = () => {
    scaleBar(doc, L, ph - m - 12, 100);
    doc.addPage([pw, ph], "p"); guidePages++;
    fittedText(doc, `${meta.title.toUpperCase()} / ASSEMBLY GUIDE (CONTINUED)`, L, m + 12, textW, 12, true);
    y = m + 22;
  };
  y += 4;
  for (const [title, lines] of steps) {
    if (y + 16 > bottom) nextPage();
    y += 5; setText(doc, 11.5, true); doc.text(title, L, y); y += 5.5;
    for (const line of lines) {
      setText(doc, 9.5, false);
      const wrapped = doc.splitTextToSize(line, textW);
      for (const part of wrapped) {
        if (y > bottom) { nextPage(); setText(doc, 9.5, false); }
        doc.text(part, L, y); y += 4.6;
      }
    }
  }
  scaleBar(doc, L, ph - m - 12, 100);
  return guidePages;
}

function bracket(doc, a, b, fixed, vertical, label) {
  doc.setDrawColor(32, 43, 51); doc.setLineWidth(0.4);
  setText(doc, 6.5, true);
  if (!vertical) { // band along x, drawn above the artwork at y=fixed
    doc.line(a, fixed, b, fixed); doc.line(a, fixed - 1, a, fixed + 2); doc.line(b, fixed - 1, b, fixed + 2);
    doc.text(label, (a + b) / 2, fixed - 1.8, { align: "center" });
  } else { // band along y, drawn left of the artwork at x=fixed
    doc.line(fixed, a, fixed, b); doc.line(fixed - 1, a, fixed + 2, a); doc.line(fixed - 1, b, fixed + 2, b);
    textUp(doc, label, fixed - 1.8, (a + b) / 2);
  }
}

function sheetPage(doc, face, fp, col, row, plan, meta, pageNo, totalPages) {
  const { pageW: pw, pageH: ph, tw, th, overlap: O, cols, rows, w: fw, h: fh } = fp;
  const m = plan.margin, w = plan.wrap;
  const X0 = (pw - tw) / 2, Y0 = m + HEAD + GUT;
  const win = { x0: col * fp.stepX, y0: row * fp.stepY };
  win.x1 = win.x0 + tw; win.y1 = win.y0 + th;
  const toPage = { x: v => X0 + v - win.x0, y: v => Y0 + v - win.y0 };
  const id = sheetId(col, row);

  // Reserve a fixed header area even for the largest supported grid.
  const cell = Math.min(4, 12 / rows, 28 / cols);
  const mapX = pw - m - 4 - cols * cell, mapY = m + 2;
  const noteWidth = 35, headerRight = mapX - noteWidth - 5;
  fittedText(doc, `${fp.name.toUpperCase()}${fp.name === "bottom" ? " (OPTIONAL)" : ""}  /  ${id}`, m + 4, m + 8, headerRight - m - 4, 16, true);
  const ovText = O ? ` / ${fmt(O)} mm overlap` : "";
  fittedText(doc, `PRINT AT 100% / ${plan.paperName} ${fp.orient} / face ${fmt(fw)} x ${fmt(fh)} mm + ${fmt(w)} mm tabs${ovText} / ${meta.title}`, m + 4, m + 14, mapX - m - 8, 8);
  doc.setDrawColor(32, 43, 51); doc.setLineWidth(Math.min(0.25, cell / 5)); doc.setFillColor(32, 43, 51);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    doc.rect(mapX + c * cell, mapY + r * cell, cell, cell, c === col && r === row ? "FD" : "S");
  const note = `${EDGE_NOTE[fp.name] || "TOP EDGE"} UP`;
  setText(doc, 7.5, true);
  const noteX = mapX - 4;
  doc.text(note, noteX, m + 7, { align: "right" });
  const tx = noteX - doc.getTextWidth(note) - 4;
  doc.setFillColor(32, 43, 51); doc.triangle(tx - 2, m + 7, tx + 2, m + 7, tx, m + 3.5, "F");

  drawFaceArt(doc, face, fp, win, toPage);

  // Blank corners: solid cut lines and a CUT label.
  doc.setDrawColor(32, 43, 51); doc.setLineWidth(0.35);
  if (w > 0) for (const cx of [0, w + fw]) for (const cy of [0, w + fh]) {
    const x0 = Math.max(cx, win.x0), x1 = Math.min(cx + w, win.x1), y0 = Math.max(cy, win.y0), y1 = Math.min(cy + w, win.y1);
    if (x1 - x0 <= 0 || y1 - y0 <= 0) continue;
    const fx = cx === 0 ? w : w + fw, fy = cy === 0 ? w : w + fh;
    if (fx >= win.x0 && fx <= win.x1) doc.line(toPage.x(fx), toPage.y(y0), toPage.x(fx), toPage.y(y1));
    if (fy >= win.y0 && fy <= win.y1) doc.line(toPage.x(x0), toPage.y(fy), toPage.x(x1), toPage.y(fy));
    if (x1 - x0 > 8 && y1 - y0 > 5) { setText(doc, 7, true); doc.text("CUT", toPage.x((x0 + x1) / 2), toPage.y((y0 + y1) / 2) + 1, { align: "center" }); }
  }

  // Fold ticks in the gutter where each fold line crosses this sheet.
  doc.setLineDashPattern([1.5, 1], 0); doc.setLineWidth(0.35);
  for (const f of [w, w + fw]) if (f > win.x0 && f < win.x1) {
    const x = toPage.x(f); doc.line(x, Y0 + th + 2, x, Y0 + th + 9); doc.line(x, Y0 - 2, x, Y0 - 9);
  }
  for (const f of [w, w + fh]) if (f > win.y0 && f < win.y1) {
    const y = toPage.y(f); doc.line(X0 + tw + 2, y, X0 + tw + 9, y); doc.line(X0 - 2, y, X0 - 9, y);
  }
  doc.setLineDashPattern([], 0);

  // Crop marks at the sheet corners.
  doc.setLineWidth(0.3);
  for (const [x, dx] of [[X0, -1], [X0 + tw, 1]]) for (const [y, dy] of [[Y0, -1], [Y0 + th, 1]]) {
    doc.line(x + dx * 2, y, x + dx * 7, y); doc.line(x, y + dy * 2, x, y + dy * 7);
  }

  // Overlap bands shared with neighbouring sheets.
  if (col > 0) bracket(doc, X0, X0 + O, Y0 - 4, false, `GOES UNDER ${sheetId(col - 1, row)}`);
  if (col < cols - 1) bracket(doc, X0 + tw - O, X0 + tw, Y0 - 4, false, `${sheetId(col + 1, row)} GOES UNDER`);
  if (row > 0) bracket(doc, Y0, Y0 + O, X0 - 4, true, `GOES UNDER ${sheetId(col, row - 1)}`);
  if (row < rows - 1) bracket(doc, Y0 + th - O, Y0 + th, X0 - 4, true, `${sheetId(col, row + 1)} GOES UNDER`);

  // Footer.
  scaleBar(doc, m + 4, ph - m - 9, pw - 2 * m > 190 ? 100 : 50);
  setText(doc, 8, false);
  fittedText(doc, "Trim at corner marks. Dashed ticks = fold. Keep textured tabs.", pw - m - 4, ph - m - 9, pw - 2 * m - 12 - (pw - 2 * m > 190 ? 100 : 50), 8, false, { align: "right" });
  setText(doc, 8, true);
  doc.text(`${pageNo} / ${totalPages}`, pw - m - 4, ph - m - 4, { align: "right" });
}

function buildPdf(JsPDF, faces, plan, meta) {
  const P = PAPERS[plan.paper], fmtArr = [P.w, P.h];
  const makeDoc = () => new JsPDF({ orientation: "p", unit: "mm", format: fmtArr, compress: true });
  const pageListFor = guideCount => {
    let page = guideCount + 1;
    const list = [guideCount === 1 ? "Page 1 is this guide." : `Pages 1-${guideCount} are this guide.`];
    for (const fp of plan.faces) {
      const a = page; page += fp.sheets;
      const label = fp.name[0].toUpperCase() + fp.name.slice(1) + (fp.name === "bottom" ? " (optional)" : "");
      const pages = fp.sheets === 1 ? `page ${a}` : `pages ${a}-${page - 1}`;
      list.push(`${label}: ${pages}, ${fp.cols} x ${fp.rows} sheets, face ${fmt(fp.w)} x ${fmt(fp.h)} mm.`);
    }
    return list;
  };
  // Measure the guide first so printed page ranges include continuation pages.
  let guideCount = guidePage(makeDoc(), plan, meta, pageListFor(1));
  let doc = makeDoc();
  let actual = guidePage(doc, plan, meta, pageListFor(guideCount));
  if (actual !== guideCount) {
    guideCount = actual; doc = makeDoc();
    actual = guidePage(doc, plan, meta, pageListFor(guideCount));
  }
  const what = plan.cube ? `${fmt(plan.box.W)} mm cube` : boxText(plan.box) + " box";
  doc.setProperties({ title: `${meta.title} - ${what} - ${plan.paperName} panels`, creator: "Block Wrap Printer" });
  const totalPages = plan.totalSheets + actual;
  let page = actual + 1;
  for (const fp of plan.faces)
    for (let r = 0; r < fp.rows; r++)
      for (let c = 0; c < fp.cols; c++) {
        doc.addPage(fmtArr, fp.orient === "landscape" ? "l" : "p");
        sheetPage(doc, faces[fp.name], fp, c, r, plan, meta, page++, totalPages);
      }
  return doc;
}

if (typeof module !== "undefined") module.exports = { PRESETS, PRESET_IMAGES, detectLayout, extractFaces, planLayout, buildPdf, rotateFace, readSquare, faceBands, axisBands, FACE_ORDER };
</script>

<script>
/* ---------- Page UI ---------- */
const $ = id => document.getElementById(id);
const state = { img: null, source: "wither", wrapEdited: false, unit: "mm" };
const UNIT_MM = { mm: 1, cm: 10, in: 25.4 };
const UNIT_LABEL = { mm: "mm", cm: "cm", in: "in" };

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas");
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      const ctx = c.getContext("2d");
      ctx.drawImage(im, 0, 0);
      resolve(ctx.getImageData(0, 0, c.width, c.height));
    };
    im.onerror = () => reject(new Error("That file could not be read as an image."));
    im.src = src;
  });
}

/** Paint one face (no tabs) from its texel bands at `scale` canvas px per mm. */
function paintFace(face, fb, scale) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(fb.w * scale)); c.height = Math.max(1, Math.round(fb.h * scale));
  const ctx = c.getContext("2d"), n = face.n;
  for (const yb of fb.yb) for (const xb of fb.xb) {
    const k = (Math.min(n - 1, yb.i) * n + Math.min(n - 1, xb.i)) * 4;
    if (face.px[k + 3] < 128) continue;
    ctx.fillStyle = `rgb(${face.px[k]},${face.px[k + 1]},${face.px[k + 2]})`;
    const x0 = Math.floor(xb.a * scale), y0 = Math.floor(yb.a * scale);
    ctx.fillRect(x0, y0, Math.ceil(xb.b * scale) - x0, Math.ceil(yb.b * scale) - y0);
  }
  return c;
}

function texelCanvas(face, scale) {
  const fb = { w: face.n, h: face.n, xb: [], yb: [] };
  for (let i = 0; i < face.n; i++) { fb.xb.push({ a: i, b: i + 1, i }); fb.yb.push({ a: i, b: i + 1, i }); }
  return paintFace(face, fb, scale);
}

const num = id => { const raw = $(id).value.trim(), v = Number(raw); return raw !== "" && Number.isFinite(v) && v > 0 ? v : null; };
const toMm = v => v * UNIT_MM[state.unit];
const autoWrap = mm => Math.round(Math.min(25, mm / 8) * 10) / 10;
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const isBox = () => $("shapeBox").checked;

async function buildPresetButtons() {
  for (const [key, p] of Object.entries(PRESETS)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "preset"; b.dataset.key = key;
    const img = await loadImage(PRESET_IMAGES[p.image]);
    const { faces } = extractFaces(img, p.layout, { uniform: p.uniform });
    b.append(texelCanvas(faces.front, Math.max(1, Math.round(40 / faces.front.n))), document.createTextNode(p.label));
    b.addEventListener("click", () => usePreset(key));
    $("presets").append(b);
  }
}

async function usePreset(key) {
  const p = PRESETS[key];
  state.source = key;
  state.img = await loadImage(PRESET_IMAGES[p.image]);
  $("layout").value = p.layout; $("uniform").value = p.uniform; $("title").value = p.title;
  if (!isBox()) { $("size").value = fmt(p.sizeMm / UNIT_MM[state.unit]); state.wrapEdited = false; }
  $("notice").hidden = true;
  update();
}

async function useFile(file) {
  if (!file) return;
  try {
    const url = URL.createObjectURL(file);
    state.img = await loadImage(url);
    URL.revokeObjectURL(url);
  } catch (e) { showNotice(e.message); return; }
  state.source = "upload";
  $("title").value = file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").slice(0, 40);
  $("uniform").value = "";
  const guess = detectLayout(state.img);
  if (guess) { $("layout").value = guess; $("notice").hidden = true; }
  else showNotice(`This image is ${state.img.width} × ${state.img.height}, which doesn't match a skin, an unfolded cube or a square tile. Choose how to read it below.`);
  update();
}

function showNotice(msg) { $("notice").textContent = msg; $("notice").hidden = false; }

/** Rebuild the top/front choices from the three measured edges, keeping the current picks. */
function syncBoxChoices() {
  const u = UNIT_LABEL[state.unit];
  const e = { A: num("dimA"), B: num("dimB"), C: num("dimC") };
  const name = { A: "Length", B: "Width", C: "Height" };
  const v = k => (e[k] ? fmt(e[k]) : "?");
  const top = $("topFace"), prevTop = top.value || "AB";
  top.innerHTML = "";
  for (const pair of ["AB", "AC", "BC"]) {
    const up = "ABC".replace(pair[0], "").replace(pair[1], "");
    const o = new Option(`${name[pair[0]]} × ${name[pair[1]]} side (${v(pair[0])} × ${v(pair[1])} ${u}), ${v(up)} ${u} tall`, pair);
    top.add(o);
  }
  top.value = prevTop;
  const front = $("frontEdge"), prevFront = front.value;
  front.innerHTML = "";
  for (const k of top.value) front.add(new Option(`${name[k]} side faces front (${v(k)} ${u} wide)`, k));
  front.value = prevFront && top.value.includes(prevFront) ? prevFront : top.value[0];
  $("boxUnitHint").textContent = `In ${state.unit === "in" ? "inches" : u}. Measure the outside of the box.`;
}

/** The box in mm as width (front), depth and height, or null if incomplete. */
function readBox() {
  if (!isBox()) { const s = num("size"); return s ? { W: toMm(s), D: toMm(s), H: toMm(s) } : null; }
  const e = { A: num("dimA"), B: num("dimB"), C: num("dimC") };
  if (!e.A || !e.B || !e.C) return null;
  const top = $("topFace").value, frontK = $("frontEdge").value;
  const depthK = top.replace(frontK, ""), upK = "ABC".replace(top[0], "").replace(top[1], "");
  return { W: toMm(e[frontK]), D: toMm(e[depthK]), H: toMm(e[upK]) };
}

let current = null;
function update() {
  // Never leave a previous printable plan active while inputs are invalid or incomplete.
  current = null;
  $("makeBtn").disabled = true;
  document.querySelectorAll(".preset").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.key === state.source)));
  const layout = $("layout").value;
  $("hatRow").hidden = layout !== "skin";
  $("uniformRow").hidden = layout === "tile";
  $("cubeFields").hidden = isBox();
  $("boxFields").hidden = !isBox();
  if (isBox()) {
    syncBoxChoices();
    const unitRow = $("cubeFields"); // the unit select lives in the cube row; show it alone in box mode
    unitRow.hidden = false; $("size").closest("label").hidden = true;
  } else $("size").closest("label").hidden = false;
  const box = readBox();
  if (!state.wrapEdited && box) $("wrap").value = autoWrap(Math.min(box.W, box.D, box.H));
  if (!state.img) return;
  const ex = extractFaces(state.img, layout, { hat: $("hat").checked, uniform: $("uniform").value });
  const fail = msg => { showNotice(msg); $("status").textContent = msg; $("stats").innerHTML = ""; current = null; $("makeBtn").disabled = true; };
  if (ex.error) return fail(ex.error);
  if (state.source !== "upload" || detectLayout(state.img)) $("notice").hidden = true;
  if (!box) return fail(isBox() ? "Enter three finite box measurements greater than zero." : "Enter a finite face size greater than zero.");
  if (!Object.values(box).every(v => Number.isFinite(v) && v > 0)) return fail("The converted box measurements are too large.");
  const fit = isBox() ? $("fit").value : "stretch";
  const n = ex.faces.front.n;
  const pixel = Math.min(box.W, box.D, box.H) / n;
  $("fitHint").textContent = fit === "stretch"
    ? "Pixels stretch into rectangles so each face shows the whole texture once."
    : `Square ${fmt(pixel)} mm pixels everywhere, so the texture fits the shortest edge once and repeats along longer ones.`;
  const overlapRaw = $("overlap").value.trim();
  const overlapVal = overlapRaw === "" ? null : Number(overlapRaw);
  const wrapRaw = $("wrap").value.trim(), wrapVal = Number(wrapRaw);
  const marginRaw = $("margin").value.trim(), marginVal = Number(marginRaw);
  if (overlapVal !== null && (!Number.isFinite(overlapVal) || overlapVal < 5)) return fail("Overlap must be at least 5 mm, or blank for automatic overlap.");
  if (wrapRaw === "" || !Number.isFinite(wrapVal) || wrapVal < 0) return fail("Wrap tab width must be a finite number of 0 mm or more.");
  if (marginRaw === "" || !Number.isFinite(marginVal) || marginVal < 0 || marginVal > 25) return fail("Printer margin must be between 0 and 25 mm.");
  const plan = planLayout({
    box, n, fit, wrap: wrapVal,
    paper: $("paper").value, margin: marginVal,
    overlap: overlapVal, includeBottom: $("bottom").checked,
  });
  renderBox(ex.faces, box, n, fit);
  renderNet(ex.faces, box, n, fit);
  if (plan.error) { fail(plan.error); $("stats").innerHTML = ""; return; }
  current = { faces: ex.faces, plan, box, n, fit };
  $("makeBtn").disabled = false;
  $("status").textContent = "";
  renderStats(plan, pixel);
  syncPlanFaces(plan);
  renderPlan();
}

function renderStats(plan, pixel) {
  const b = plan.box, f = plan.faces[0];
  const stats = [
    [plan.cube ? `${fmt(b.W)} mm` : `${fmt(b.W)}×${fmt(b.D)}×${fmt(b.H)}`, plan.cube ? "cube face" : "box mm (w × d × h)"],
    [plan.totalSheets, `${plan.paperName} panel sheets + guide`],
    [f.overlap ? `${fmt(f.overlap)} mm` : "none", "overlap on the front"],
    plan.fit === "stretch" && !plan.cube
      ? [`${fmt(f.w / plan.n)}×${fmt(f.h / plan.n)}`, "front pixel, mm"]
      : [`${fmt(pixel)} mm`, `per pixel (${plan.n} × ${plan.n} texture)`],
  ];
  $("stats").innerHTML = "";
  for (const [bb, s] of stats) {
    const d = document.createElement("div"); d.className = "stat";
    const e1 = document.createElement("b"); e1.textContent = bb;
    const e2 = document.createElement("span"); e2.textContent = s;
    d.append(e1, e2); $("stats").append(d);
  }
  const facts = plan.faces.map(fp => `<b>${fp.name[0].toUpperCase() + fp.name.slice(1)}</b> ${fmt(fp.w)} × ${fmt(fp.h)} mm: ${fp.cols} × ${fp.rows} ${plan.paperName} ${fp.orient} ${fp.sheets === 1 ? "sheet" : "sheets"}${fp.overlap ? `, ${fmt(fp.overlap)} mm overlap` : ""}.`);
  facts.push(`Wrap tabs are <b>${fmt(plan.wrap)} mm</b>.${plan.faces.some(f => f.name === "bottom") ? " Skip the bottom pages for an open-bottom box." : ""}`);
  $("facts").innerHTML = facts.map(f => `<li>${f}</li>`).join("");
}

// 3D scale comparison objects (soda can ~122 mm, banana ~180 mm)
function createSodaCan(k, box) {
  const canH = 122 * k, canR = 33 * k;
  const W = box.W * k, H = box.H * k, D = box.D * k;
  const gap = Math.max(16, 26 * k);
  const canX = W / 2 + gap + canR;
  const canY = (H - canH) / 2;
  const canZ = D * 0.22;

  const holder = document.createElement("div");
  holder.className = "scale-can";
  holder.style.position = "absolute";
  holder.style.transformStyle = "preserve-3d";
  holder.style.transform = `translate3d(${canX}px, ${canY}px, ${canZ}px)`;

  // Ground shadow
  const shadow = document.createElement("div");
  shadow.style.position = "absolute";
  shadow.style.width = (canR * 2.5) + "px";
  shadow.style.height = (canR * 2.5) + "px";
  shadow.style.left = (-canR * 1.25) + "px";
  shadow.style.top = (-canR * 1.25) + "px";
  shadow.style.borderRadius = "50%";
  shadow.style.transform = `translateY(${canH / 2 + 0.4}px) rotateX(90deg)`;
  shadow.style.background = "radial-gradient(ellipse at center, rgba(0,0,0,0.36) 0%, rgba(0,0,0,0.12) 50%, rgba(0,0,0,0) 75%)";
  shadow.style.pointerEvents = "none";
  holder.append(shadow);

  // Top lid (silver aluminum with rim and tab)
  const lid = document.createElement("div");
  lid.style.position = "absolute";
  lid.style.width = (canR * 2) + "px";
  lid.style.height = (canR * 2) + "px";
  lid.style.left = (-canR) + "px";
  lid.style.top = (-canR) + "px";
  lid.style.borderRadius = "50%";
  lid.style.transform = `translateY(${-canH / 2}px) rotateX(90deg)`;
  lid.style.background = "radial-gradient(circle at 45% 45%, #f1f5f9 0%, #cbd5e1 60%, #94a3b8 100%)";
  lid.style.boxShadow = "inset 0 0 0 1px #64748b";

  // Pull tab
  const tab = document.createElement("div");
  tab.style.position = "absolute";
  tab.style.width = Math.max(3, canR * 0.45) + "px";
  tab.style.height = Math.max(5, canR * 0.72) + "px";
  tab.style.left = (canR - canR * 0.22) + "px";
  tab.style.top = (canR * 0.58) + "px";
  tab.style.borderRadius = "2px";
  tab.style.background = "#e2e8f0";
  tab.style.border = "1px solid #64748b";
  lid.append(tab);
  holder.append(lid);

  // Bottom base
  const base = document.createElement("div");
  base.style.position = "absolute";
  base.style.width = (canR * 2) + "px";
  base.style.height = (canR * 2) + "px";
  base.style.left = (-canR) + "px";
  base.style.top = (-canR) + "px";
  base.style.borderRadius = "50%";
  base.style.transform = `translateY(${canH / 2}px) rotateX(-90deg)`;
  base.style.background = "radial-gradient(circle, #94a3b8 0%, #64748b 100%)";
  holder.append(base);

  // Can label canvas
  const N = 12;
  const facetW = Math.ceil(2 * canR * Math.tan(Math.PI / N)) + 0.6;
  const facetDist = canR;
  const totalW = Math.round(N * facetW);
  const labelCanvas = document.createElement("canvas");
  labelCanvas.width = totalW;
  labelCanvas.height = Math.max(1, Math.round(canH));
  const ctx = labelCanvas.getContext("2d");
  const cw = labelCanvas.width, ch = labelCanvas.height;

  const rimH = Math.max(2, ch * 0.08);
  // Silver top rim
  const rimGrad = ctx.createLinearGradient(0, 0, 0, rimH);
  rimGrad.addColorStop(0, "#94a3b8"); rimGrad.addColorStop(0.5, "#e2e8f0"); rimGrad.addColorStop(1, "#94a3b8");
  ctx.fillStyle = rimGrad;
  ctx.fillRect(0, 0, cw, rimH);

  // Red body gradient
  const bodyGrad = ctx.createLinearGradient(0, rimH, 0, ch - rimH);
  bodyGrad.addColorStop(0, "#b91c1c"); bodyGrad.addColorStop(0.2, "#dc2626"); bodyGrad.addColorStop(0.8, "#ef4444"); bodyGrad.addColorStop(1, "#991b1b");
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(0, rimH, cw, ch - 2 * rimH);

  // White dynamic swoosh across label
  ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
  ctx.beginPath();
  ctx.moveTo(0, rimH + (ch - 2 * rimH) * 0.62);
  ctx.bezierCurveTo(cw * 0.25, rimH + (ch - 2 * rimH) * 0.45, cw * 0.45, rimH + (ch - 2 * rimH) * 0.75, cw * 0.7, rimH + (ch - 2 * rimH) * 0.55);
  ctx.lineTo(cw * 0.7, rimH + (ch - 2 * rimH) * 0.66);
  ctx.bezierCurveTo(cw * 0.45, rimH + (ch - 2 * rimH) * 0.84, cw * 0.25, rimH + (ch - 2 * rimH) * 0.54, 0, rimH + (ch - 2 * rimH) * 0.71);
  ctx.closePath();
  ctx.fill();

  // "COLA" text on front
  const fontSize = Math.max(7, Math.round(ch * 0.17));
  ctx.font = `700 ${fontSize}px Silkscreen, monospace`;
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.4)";
  ctx.shadowOffsetY = 1;
  ctx.shadowBlur = 2;
  ctx.fillText("COLA", cw * 0.25, ch * 0.44);
  ctx.shadowColor = "transparent";

  // Silver bottom rim
  const botRimGrad = ctx.createLinearGradient(0, ch - rimH, 0, ch);
  botRimGrad.addColorStop(0, "#94a3b8"); botRimGrad.addColorStop(0.5, "#cbd5e1"); botRimGrad.addColorStop(1, "#64748b");
  ctx.fillStyle = botRimGrad;
  ctx.fillRect(0, ch - rimH, cw, rimH);

  const labelUrl = labelCanvas.toDataURL("image/png");

  // Create cylinder facets
  for (let i = 0; i < N; i++) {
    const angle = i * (360 / N);
    const facet = document.createElement("div");
    facet.style.position = "absolute";
    facet.style.left = (-facetW / 2) + "px";
    facet.style.top = (-canH / 2) + "px";
    facet.style.width = facetW + "px";
    facet.style.height = canH + "px";
    facet.style.transform = `rotateY(${angle}deg) translateZ(${facetDist}px)`;
    facet.style.backgroundImage = `url(${labelUrl})`;
    facet.style.backgroundPosition = `${-i * facetW}px 0px`;
    facet.style.backgroundSize = `${totalW}px ${canH}px`;
    facet.style.backfaceVisibility = "hidden";
    const rad = (angle - 45) * Math.PI / 180;
    const light = Math.max(0.48, Math.min(1.18, 0.82 + 0.32 * Math.cos(rad)));
    facet.style.filter = `brightness(${light.toFixed(2)})`;
    holder.append(facet);
  }

  return holder;
}

function createBanana(k, box) {
  const banL = 180 * k, banR = 18 * k;
  const W = box.W * k, H = box.H * k, D = box.D * k;
  const gap = Math.max(16, 26 * k);
  const banX = W / 2 + gap + banR * 1.5;
  const banY = H / 2;
  const banZ = D * 0.15;

  const holder = document.createElement("div");
  holder.className = "scale-banana";
  holder.style.position = "absolute";
  holder.style.transformStyle = "preserve-3d";
  holder.style.transform = `translate3d(${banX}px, ${banY}px, ${banZ}px)`;

  // Ground shadow
  const shadow = document.createElement("div");
  shadow.style.position = "absolute";
  shadow.style.width = (banR * 2.2) + "px";
  shadow.style.height = (banL * 1.05) + "px";
  shadow.style.left = (-banR * 1.1) + "px";
  shadow.style.top = (-banL * 0.52) + "px";
  shadow.style.borderRadius = "40%";
  shadow.style.transform = `translateY(0.4px) rotateX(90deg) rotateZ(10deg)`;
  shadow.style.background = "radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0) 75%)";
  shadow.style.pointerEvents = "none";
  holder.append(shadow);

  // 9 curved segments along the arc
  const S = 9;
  for (let s = 0; s < S; s++) {
    const u = s / (S - 1);
    const arch = Math.sin(u * Math.PI);
    const z = (u - 0.5) * banL;
    const xCurve = (1 - arch) * (banR * 1.4);
    const yCurl = -banR - (1 - arch) * (banR * 1.1);

    const segR = banR * (0.35 + 0.65 * arch);
    const segH = (banL / S) * 1.08;

    const seg = document.createElement("div");
    seg.style.position = "absolute";
    seg.style.width = (segR * 2) + "px";
    seg.style.height = (segR * 2) + "px";
    seg.style.left = (-segR) + "px";
    seg.style.top = (-segR) + "px";
    seg.style.transformStyle = "preserve-3d";

    const rotY = (u - 0.5) * -36;
    const rotX = (u - 0.5) * 20;
    seg.style.transform = `translate3d(${xCurve}px, ${yCurl}px, ${z}px) rotateY(${rotY}deg) rotateX(${rotX}deg)`;

    let topColor = "#fff066", sideColor = "#fec810", botColor = "#e6ab08";
    if (u < 0.12) {
      topColor = "#3d3b14"; sideColor = "#302e0e"; botColor = "#242208";
    } else if (u < 0.22) {
      topColor = "#b8d433"; sideColor = "#9bb828"; botColor = "#7d991b";
    } else if (u > 0.88) {
      topColor = "#3a2614"; sideColor = "#2c1c0e"; botColor = "#1e1308";
    }

    const w = segR * 2, h = segR * 2, d = segH;
    const faces = [
      { t: `translateZ(${d / 2}px)`, bg: sideColor, w, h },
      { t: `rotateY(180deg) translateZ(${d / 2}px)`, bg: sideColor, w, h },
      { t: `rotateY(90deg) translateZ(${w / 2}px)`, bg: sideColor, w: d, h },
      { t: `rotateY(-90deg) translateZ(${w / 2}px)`, bg: sideColor, w: d, h },
      { t: `rotateX(90deg) translateZ(${h / 2}px)`, bg: topColor, w, h: d },
      { t: `rotateX(-90deg) translateZ(${h / 2}px)`, bg: botColor, w, h: d },
    ];
    for (const f of faces) {
      const faceEl = document.createElement("div");
      faceEl.style.position = "absolute";
      faceEl.style.width = f.w + "px";
      faceEl.style.height = f.h + "px";
      faceEl.style.left = (-f.w / 2) + "px";
      faceEl.style.top = (-f.h / 2) + "px";
      faceEl.style.background = f.bg;
      faceEl.style.transform = f.t;
      faceEl.style.backfaceVisibility = "hidden";
      seg.append(faceEl);
    }
    holder.append(seg);
  }

  return holder;
}

// 3D preview: faces sized in px, placed around the box centre.
let rot = { x: -24, y: -36 };
function renderBox(faces, box, n, fit) {
  const holder = $("box3d");
  holder.innerHTML = "";
  const scaleType = $("scaleRef") ? $("scaleRef").value : "can";
  const hasScale = scaleType !== "none";
  const k = (hasScale ? 138 : 170) / Math.max(box.W, box.D, box.H), res = 2;
  const W = box.W * k, D = box.D * k, H = box.H * k;

  // Ground shadow under the box
  const boxShadow = document.createElement("div");
  boxShadow.style.position = "absolute";
  boxShadow.style.width = (W * 1.1) + "px";
  boxShadow.style.height = (D * 1.1) + "px";
  boxShadow.style.left = (-W * 1.1 / 2) + "px";
  boxShadow.style.top = (-D * 1.1 / 2) + "px";
  boxShadow.style.transform = `translateY(${H / 2 + 0.3}px) rotateX(90deg)`;
  boxShadow.style.background = "radial-gradient(ellipse at center, rgba(0,0,0,0.32) 0%, rgba(0,0,0,0.12) 55%, rgba(0,0,0,0) 75%)";
  boxShadow.style.pointerEvents = "none";
  holder.append(boxShadow);

  const place = {
    front: `translateZ(${D / 2}px)`, back: `rotateY(180deg) translateZ(${D / 2}px)`,
    right: `rotateY(90deg) translateZ(${W / 2}px)`, left: `rotateY(-90deg) translateZ(${W / 2}px)`,
    top: `rotateX(90deg) translateZ(${H / 2}px)`, bottom: `rotateX(-90deg) translateZ(${H / 2}px)`,
  };
  for (const name of FACE_ORDER) {
    const fb = faceBands(name, box, n, fit, 0);
    const c = paintFace(faces[name], fb, k * res);
    const cw = fb.w * k, ch = fb.h * k;
    c.style.width = cw + "px"; c.style.height = ch + "px";
    c.style.transform = `translate(${-cw / 2}px, ${-ch / 2}px) ${place[name]}`;
    holder.append(c);
  }

  // Scale reference item
  if (scaleType === "can") {
    holder.append(createSodaCan(k, box));
  } else if (scaleType === "banana") {
    holder.append(createBanana(k, box));
  }

  applyRotation();
}
function applyRotation() { $("box3d").style.transform = `rotateX(${rot.x}deg) rotateY(${rot.y}deg)`; }
function enableDrag() {
  const st = $("boxStage");
  let start = null;
  st.addEventListener("pointerdown", e => { start = { x: e.clientX, y: e.clientY, r: { ...rot } }; st.setPointerCapture(e.pointerId); });
  st.addEventListener("pointermove", e => {
    if (!start) return;
    rot.y = start.r.y + (e.clientX - start.x) * 0.5;
    rot.x = Math.max(-80, Math.min(80, start.r.x - (e.clientY - start.y) * 0.5));
    applyRotation();
  });
  const end = () => { start = null; };
  st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end);
}

/** Unfolded box at true proportions: back above the top, left/top/right across, front and bottom below. */
function netImage(faces, box, n, fit, maxW, maxH, labels) {
  const { W, D, H } = box, gapMm = Math.max(W, D, H) * 0.015;
  const totalW = 2 * H + W + 2 * gapMm, totalH = 2 * H + 2 * D + 3 * gapMm;
  const k = Math.min(maxW / totalW, maxH / totalH);
  const c = document.createElement("canvas");
  c.width = Math.round(totalW * k); c.height = Math.round(totalH * k);
  const ctx = c.getContext("2d");
  const colX = [0, H + gapMm, H + W + 2 * gapMm], rowY = [0, H + gapMm, H + D + 2 * gapMm, 2 * H + D + 3 * gapMm];
  // name: [column, row, cell width, cell height, clockwise turns to fold it back into the cross]
  const cells = { back: [1, 0, W, H, 2], left: [0, 1, H, D, 1], top: [1, 1, W, D, 0], right: [2, 1, H, D, 3], front: [1, 2, W, H, 0], bottom: [1, 3, W, D, 0] };
  for (const [name, [cx, cy, cw, ch, turns]] of Object.entries(cells)) {
    const fc = paintFace(faces[name], faceBands(name, box, n, fit, 0), k);
    const x = colX[cx] * k, y = rowY[cy] * k;
    ctx.save();
    ctx.translate(x + cw * k / 2, y + ch * k / 2);
    ctx.rotate(turns * Math.PI / 2);
    ctx.drawImage(fc, -fc.width / 2, -fc.height / 2);
    ctx.restore();
    if (labels) {
      const fs = Math.max(10, Math.min(14, Math.min(cw, ch) * k / 6));
      ctx.font = `600 ${fs}px ${cssVar("--font-body") || "sans-serif"}`;
      const tw = ctx.measureText(name).width;
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(x + 3, y + 3, tw + 8, fs + 6);
      ctx.fillStyle = "#fff"; ctx.textBaseline = "top"; ctx.fillText(name, x + 7, y + 6);
    }
  }
  return c;
}

function renderNet(faces, box, n, fit) {
  const img = netImage(faces, box, n, fit, 600, 760, true);
  const c = $("net");
  c.width = img.width; c.height = img.height;
  c.style.width = img.width / 2 + "px";
  c.getContext("2d").drawImage(img, 0, 0);
}

function syncPlanFaces(plan) {
  const sel = $("planFace"), prev = sel.value || "front";
  sel.innerHTML = "";
  for (const fp of plan.faces) sel.add(new Option(fp.name, fp.name));
  sel.value = plan.faces.some(f => f.name === prev) ? prev : "front";
}

function renderPlan() {
  if (!current) return;
  const fp = current.plan.faces.find(f => f.name === $("planFace").value) || current.plan.faces[0];
  const face = current.faces[fp.name], w = current.plan.wrap;
  const c = $("plan"), ctx = c.getContext("2d");
  const maxPx = 1000, pad = 16;
  const k = (maxPx - 2 * pad) / Math.max(fp.Tw, fp.Th);
  c.width = Math.round(fp.Tw * k + 2 * pad); c.height = Math.round(fp.Th * k + 2 * pad);
  c.style.width = c.width / 1.8 + "px";
  ctx.clearRect(0, 0, c.width, c.height);
  const P = v => pad + v * k, n = face.n;
  for (const yb of fp.yb) for (const xb of fp.xb) {
    if (xb.tab && yb.tab) continue;
    const i = (Math.min(n - 1, yb.i) * n + Math.min(n - 1, xb.i)) * 4;
    if (face.px[i + 3] < 128) continue;
    ctx.fillStyle = `rgb(${face.px[i]},${face.px[i + 1]},${face.px[i + 2]})`;
    const x0 = Math.floor(P(xb.a)), y0 = Math.floor(P(yb.a));
    ctx.fillRect(x0, y0, Math.ceil(P(xb.b)) - x0, Math.ceil(P(yb.b)) - y0);
  }
  // Tabs tint and fold lines.
  ctx.fillStyle = "rgba(255,255,255,0.28)";
  ctx.fillRect(P(w), P(0), fp.w * k, w * k); ctx.fillRect(P(w), P(w + fp.h), fp.w * k, w * k);
  ctx.fillRect(P(0), P(w), w * k, fp.h * k); ctx.fillRect(P(w + fp.w), P(w), w * k, fp.h * k);
  ctx.setLineDash([8, 6]); ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 2.5;
  ctx.strokeRect(P(w), P(w), fp.w * k, fp.h * k);
  ctx.setLineDash([]);
  // Overlap bands and sheet outlines.
  const accent = cssVar("--accent") || "#c8460f";
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  for (let col = 1; col < fp.cols; col++) ctx.fillRect(P(col * fp.stepX), P(0), fp.overlap * k, fp.Th * k);
  for (let row = 1; row < fp.rows; row++) ctx.fillRect(P(0), P(row * fp.stepY), fp.Tw * k, fp.overlap * k);
  ctx.strokeStyle = accent; ctx.lineWidth = 3.5;
  ctx.font = `600 24px ${cssVar("--font-data") || "monospace"}`; ctx.textBaseline = "top";
  for (let row = 0; row < fp.rows; row++) for (let col = 0; col < fp.cols; col++) {
    const x = P(col * fp.stepX), y = P(row * fp.stepY);
    ctx.strokeRect(x + 2, y + 2, fp.tw * k - 4, fp.th * k - 4);
    const label = sheetId(col, row), tw = ctx.measureText(label).width;
    ctx.fillStyle = accent; ctx.fillRect(x + 10, y + 10, tw + 16, 36);
    ctx.fillStyle = "#fff"; ctx.fillText(label, x + 18, y + 16);
  }
  $("planCaption").innerHTML = `<b>How the ${fp.name} splits across ${fp.sheets === 1 ? "one sheet" : fp.sheets + " sheets"}.</b> Dashed line = folds; lighter bands = tabs and overlaps; corners are cut away.`;
}

async function makePdf() {
  if (!current) return;
  const btn = $("makeBtn");
  btn.disabled = true; $("status").textContent = "Building the PDF…";
  try {
    const { plan, faces, box, n, fit } = current;
    const title = ($("title").value || "Minecraft block").trim();
    const net = netImage(faces, box, n, fit, 480, 640, false);
    const doc = buildPdf(window.jspdf.jsPDF, faces, plan, { title, netPng: net.toDataURL("image/png"), netAspect: net.height / net.width });
    const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "block";
    const size = plan.cube ? `${fmt(box.W)}mm` : `${fmt(box.W)}x${fmt(box.D)}x${fmt(box.H)}mm`;
    const filename = `${slug}-${plan.paper}-${size}.pdf`;
    const blob = doc.output("blob");
    const downloads = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (downloads) {
      try { await downloads.save({ filename, data: blob }); $("status").textContent = `Saved ${filename}`; }
      catch (e) { $("status").textContent = e?.code === "declined" ? "Save cancelled." : `Couldn't save the file (${e?.code || "error"}).`; }
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      $("status").textContent = `Downloaded ${filename}`;
    }
  } catch (e) {
    console.error(e);
    $("status").textContent = "Something went wrong building the PDF: " + e.message;
  } finally { btn.disabled = !current; }
}

function convertUnits(next) {

    update();
  });
  $("unit").addEventListener("change", e => { convertUnits(e.target.value); update(); });
  $("planFace").addEventListener("change", renderPlan);
  $("scaleRef").addEventListener("change", () => {
    if (current) renderBox(current.faces, current.box, current.n, current.fit);
  });
  $("file").addEventListener("change", e => useFile(e.target.files[0]));
  const drop = $("drop");
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, () => drop.classList.remove("over")));
  drop.addEventListener("drop", e => { e.preventDefault(); useFile(e.dataTransfer.files[0]); });
  $("makeBtn").addEventListener("click", makePdf);
  enableDrag();
  buildPresetButtons().then(() => usePreset("wither"));
}
init();
</script>
</body>
</html>
